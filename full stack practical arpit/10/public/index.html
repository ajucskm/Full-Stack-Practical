<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product API</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Product Store</h1><form id="form"><h2>Add a product</h2><input id="name" placeholder="Product name" required><input id="price" type="number" min="0" placeholder="Price" required><input id="rating" type="number" min="0" max="5" step=".1" placeholder="Rating (0-5)" required><button>Add product</button></form><h2>All products</h2><div id="products"></div><p id="message"></p></main><script src="app.js"></script></body></html>
