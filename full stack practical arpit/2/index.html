<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>10 Horizontal Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Horizontal Card Gallery</h2>
  <div class="card-container">
    <div class="card">
      <img src="images/1.jpg" alt="King of Hearts Cat">
      <h3>King of Hearts</h3>
      
    </div>

    <div class="card">
      <img src="images/2.jpg" alt="Retro Queen of Hearts">
      <h3>Retro Queen</h3>
      
    </div>

    <div class="card">
      <img src="images/3.jpg" alt="Modern Joker">
      <h3>Geometric Joker</h3>
      
    </div>

    <div class="card">
      <img src="images/4.jpg" alt="Let's Play A Game">
      <h3>Let's Play A Game</h3>
      
    </div>

    <div class="card">
      <img src="images/5.jpg" alt="Mystic Heart">
      <h3>Mystic Heart</h3>
      
    </div>

    <div class="card">
      <img src="images/6.jpg" alt="Monochrome Suits">
      <h3>Monochrome Suits</h3>
      
    </div>

    <div class="card">
      <img src="images/7.jpg" alt="Lucky 777 Jackpot">
      <h3>Lucky 777</h3>
      
    </div>

    <div class="card">
      <img src="images/8.jpg" alt="8 of Spades">
      <h3>8 of Spades</h3>
      
    </div>

    <div class="card">
      <img src="images/9.jpg" alt="9 of Hearts">
      <h3>9 of Hearts</h3>
      
    </div>

    <div class="card">
      <img src="images/10.jpg" alt="10 of Hearts Collage">
      <h3>10 of Hearts</h3>
      
    </div>
  </div>
</body>
</html>
